name: Deploy Next.js Site to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (including build devDependencies)
        run: npm install --include=dev --legacy-peer-deps || npm install --include=dev

      - name: Prefix static image paths for GitHub Pages basePath and remove server-only API routes for static export
        run: |
          rm -rf app/api
          find app components lib -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i "s|'/images/|'/$GITHUB_RP_NAME/images/|g" {} +
          find app components lib -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i "s|\"/images/|\"/$GITHUB_RP_NAME/images/|g" {} +
        env:
          GITHUB_RP_NAME: ${{ github.event.repository.name }}

      - name: Build static Next.js export
        run: npm run build

      - name: Add .nojekyll to out directory
        run: touch ./out/.nojekyll

      - name: Deploy static export to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
