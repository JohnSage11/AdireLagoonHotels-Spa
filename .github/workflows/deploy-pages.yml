name: Deploy Next.js Site to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Prefix static image paths for GitHub Pages basePath and remove server-only API routes for static export
        run: |
          rm -rf app/api
          find app components lib -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i "s|'/images/|'/$GITHUB_RP_NAME/images/|g" {} +
          find app components lib -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's|"/images/|"/'"${{ github.event.repository.name }}"'/images/|g' {} +
        env:
          GITHUB_RP_NAME: ${{ github.event.repository.name }}

      - name: Build static Next.js export
        run: npm run build

      - name: Add .nojekyll to out directory
        run: touch ./out/.nojekyll

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
